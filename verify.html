
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>CertiVerify</h2>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<section class="hero">
    <h1>Certificate Verification</h1>
    <p>Check the authenticity of your digital certificate.</p>

    <div id="verificationResult"
         style="background:white;color:#17233c;padding:25px;
         border-radius:12px;max-width:550px;margin:30px auto;">
        Checking certificate...
    </div>
</section>

<script>
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

const params = new URLSearchParams(window.location.search);
const certificateId = params.get("id") || "";

let certificates = [];

try {
    certificates = JSON.parse(
        localStorage.getItem("certificates")
    ) || [];
} catch {
    certificates = [];
}

const certificate = certificates.find(
    cert => cert.id === certificateId
);

const result = document.getElementById("verificationResult");

if (!certificate) {
    result.innerHTML = `
        <h2 style="color:red">Invalid Certificate</h2>
        <p>Certificate not found in our records.</p>
    `;
} else if (certificate.status !== "Valid") {
    result.innerHTML = `
        <h2 style="color:#a96b0b">Certificate Revoked</h2>
        <p>This certificate is no longer valid.</p>
    `;
} else {
    result.innerHTML = `
        <h2 style="color:green">✓ Certificate Verified</h2>
        <p><b>Certificate ID:</b> ${escapeHTML(certificate.id)}</p>
        <p><b>Student:</b> ${escapeHTML(certificate.name)}</p>
        <p><b>Course:</b> ${escapeHTML(certificate.course)}</p>
        <p><b>Institution:</b> ${escapeHTML(certificate.institution)}</p>
        <p><b>Issue Date:</b> ${escapeHTML(certificate.date)}</p>
        <p><b>Status:</b> VALID</p>
    `;
}
</script>

</body>
</html>
