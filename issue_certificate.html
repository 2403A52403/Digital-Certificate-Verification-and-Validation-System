
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Certificate - CertiVerify</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .issue-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px #0002;
        }

        .issue-container h2 {
            text-align: center;
            color: #1678be;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .issue-container button {
            width: 100%;
        }

        #success {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<header>
    <h2>CertiVerify Admin</h2>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Home</a>
    </nav>
</header>

<div class="issue-container">

    <h2>Issue New Certificate</h2>

    <form id="certificateForm">

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter student name" required>
        </div>

        <div class="form-group">
            <label>Course Name</label>
            <input type="text" id="courseName"
                   placeholder="Enter course name" required>
        </div>

        <div class="form-group">
            <label>Institution Name</label>
            <input type="text" id="institution"
                   placeholder="Enter college name" required>
        </div>

        <div class="form-group">
            <label>Issue Date</label>
            <input type="date" id="issueDate" required>
        </div>

        <button type="submit">Generate Certificate</button>

    </form>

  <div id="success"></div>

<div id="qrcode" style="margin:20px auto; text-align:center;"></div>
<button type="button" id="downloadPdf"
        style="display:none; margin:20px auto;">
    Download Certificate PDF
</button>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>

<script>


let latestCertificate = null;

// Generate Certificate
document.getElementById("certificateForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    if (sessionStorage.getItem("adminLoggedIn") !== "true") {
        alert("Please login as administrator first.");
        window.location.href = "login.html";
        return;
    }

    const student = document.getElementById("studentName").value.trim();
    const course = document.getElementById("courseName").value.trim();
    const institution = document.getElementById("institution").value.trim();
    const date = document.getElementById("issueDate").value;

    let records = [];

    try {
        records = JSON.parse(localStorage.getItem("certificates")) || [];

        if (!Array.isArray(records)) {
            records = [];
        }
    } catch (error) {
        records = [];
    }

    const id = "CERT" + Date.now();

    const certificate = {
        id: id,
        name: student,
        course: course,
        institution: institution,
        date: date,
        status: "Valid"
    };

    latestCertificate = certificate;

    records.push(certificate);

    localStorage.setItem(
        "certificates",
        JSON.stringify(records)
    );

    const success = document.getElementById("success");

    success.style.display = "block";

    success.innerHTML = `
        <h3>✓ Certificate Generated Successfully!</h3>
        <p><b>Certificate ID:</b> ${id}</p>
        <p><b>Student Name:</b> ${student}</p>
        <p><b>Course:</b> ${course}</p>
        <p><b>Institution:</b> ${institution}</p>
        <p><b>Issue Date:</b> ${date}</p>
        <p><b>Status:</b> Valid</p>
    `;

    // Generate QR Code
    const qrBox = document.getElementById("qrcode");

    qrBox.innerHTML = "";

    const verifyURL = new URL(
        "verify.html",
        window.location.href
    );

    verifyURL.searchParams.set("id", id);

    if (typeof QRCode !== "undefined") {

        new QRCode(qrBox, {
            text: verifyURL.href,
            width: 180,
            height: 180,
            correctLevel: QRCode.CorrectLevel.H
        });

    } else {
        qrBox.textContent =
            "QR library could not load. Check internet connection.";
    }

    document.getElementById("downloadPdf").style.display = "block";

    this.reset();

});


// Download Certificate PDF
document.getElementById("downloadPdf")
.addEventListener("click", function() {

    if (!latestCertificate) {
        alert("Please generate a certificate first.");
        return;
    }

    if (!window.jspdf) {
        alert("PDF library not loaded. Check your internet connection.");
        return;
    }

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF({
        orientation: "landscape",
        unit: "mm",
        format: "a4"
    });

    const c = latestCertificate;

    // Background
    doc.setFillColor(248, 250, 255);
    doc.rect(0, 0, 297, 210, "F");

    // Certificate border
    doc.setDrawColor(22, 76, 130);
    doc.setLineWidth(2);
    doc.rect(8, 8, 281, 194);

    doc.setDrawColor(200, 160, 70);
    doc.setLineWidth(0.7);
    doc.rect(12, 12, 273, 186);

    // Institution heading
    doc.setTextColor(16, 35, 75);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(27);

    doc.text(
        c.institution.toUpperCase(),
        148.5, 38,
        { align: "center", maxWidth: 240 }
    );

    // Certificate title
    doc.setFontSize(22);

    doc.text(
        "CERTIFICATE OF COMPLETION",
        148.5, 62,
        { align: "center" }
    );

    // Main content
    doc.setFont("helvetica", "normal");
    doc.setFontSize(14);
    doc.setTextColor(70, 70, 70);

    doc.text(
        "This certificate is proudly presented to",
        148.5, 82,
        { align: "center" }
    );

    doc.setFont("helvetica", "bold");
    doc.setFontSize(25);
    doc.setTextColor(22, 120, 190);

    doc.text(
        c.name,
        148.5, 101,
        { align: "center", maxWidth: 190 }
    );

    doc.setFont("helvetica", "normal");
    doc.setFontSize(14);
    doc.setTextColor(60, 60, 60);

    doc.text(
        "For successfully completing the course",
        148.5, 116,
        { align: "center" }
    );

    doc.setFont("helvetica", "bold");
    doc.setFontSize(19);

    doc.text(
        c.course,
        148.5, 130,
        { align: "center", maxWidth: 190 }
    );

    // Certificate details
    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);

    doc.text("Certificate ID: " + c.id, 25, 158);
    doc.text("Issue Date: " + c.date, 25, 168);
    doc.text("Status: " + c.status, 25, 178);

    // Authorized signature
    doc.line(190, 170, 245, 170);

    doc.setFontSize(10);

    doc.text(
        "Authorized Signatory",
        217.5, 177,
        { align: "center" }
    );

    // Add QR Code
    const qrCanvas = document.querySelector("#qrcode canvas");

    if (qrCanvas) {

        const qrImage = qrCanvas.toDataURL("image/png");

        doc.addImage(
            qrImage,
            "PNG",
            245,
            85,
            30,
            30
        );

        doc.setFontSize(9);

        doc.text(
            "Scan to verify",
            260, 120,
            { align: "center" }
        );
    }

    // Download PDF
    doc.save("Certificate-" + c.id + ".pdf");

});


</script>

</body>
</html>
