
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .dashboard h1 {
            margin-bottom: 25px;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
            gap: 20px;
        }

        .dash-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px #0001;
        }

        .dash-card h2 {
            color: #1678be;
            font-size: 30px;
            margin-top: 15px;
        }

        .dashboard-actions {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .dashboard-actions a {
            display: inline-block;
            margin: 12px 15px 0 0;
            text-decoration: none;
            color: white;
            background: #1678be;
            padding: 12px 18px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<header>
    <h2>CertiVerify Admin</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
</header>

<div class="dashboard">
    <h1>Admin Dashboard</h1>
    <p>Welcome to the Certificate Management System.</p>

    <br>


<div class="dashboard-cards">

    <div class="dash-card">
        <p>Total Certificates</p>
        <h2 id="totalCertificates">0</h2>
    </div>

    <div class="dash-card">
        <p>Valid Certificates</p>
        <h2 id="validCertificates">0</h2>
    </div>

    <div class="dash-card">
        <p>Revoked Certificates</p>
        <h2 id="revokedCertificates">0</h2>
    </div>

</div>

    <div class="dashboard-actions">
        <h2>Manage Certificates</h2>

       <a href="index.html">Verify Certificate</a>

<a href="issue_certificate.html">Issue Certificate</a>

<a href="manage_certificates.html">Manage Certificates</a>
    </div>
</div>

<script>

if (sessionStorage.getItem("adminLoggedIn") !== "true") {
    window.location.href = "login.html";
}

function logout() {
    sessionStorage.removeItem("adminLoggedIn");
    window.location.href = "login.html";
}

function loadDashboard() {

    let certificates = [];

    try {
        certificates = JSON.parse(
            localStorage.getItem("certificates")
        ) || [];
    } catch (error) {
        certificates = [];
    }

    const total = certificates.length;

    const valid = certificates.filter(
        cert => cert.status === "Valid"
    ).length;

    const revoked = certificates.filter(
        cert => cert.status === "Revoked"
    ).length;

    document.getElementById("totalCertificates").textContent = total;

    document.getElementById("validCertificates").textContent = valid;

    document.getElementById("revokedCertificates").textContent = revoked;
}

loadDashboard();

</script>

</body>
</html>
